<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/app/favicon.png">
  <title>LinkedIn AI Agent — Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <link rel="stylesheet" href="/app/styles/app.css">
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const API = '';  // same-origin

    // ── Dynamic topic colors — deterministic hash from slug ──
    const TOPIC_PALETTE = [
      { color: '#3b82f6', bg: 'rgba(59,130,246,0.15)' },
      { color: '#8b5cf6', bg: 'rgba(139,92,246,0.15)' },
      { color: '#ef4444', bg: 'rgba(239,68,68,0.15)' },
      { color: '#06b6d4', bg: 'rgba(6,182,212,0.15)' },
      { color: '#10b981', bg: 'rgba(16,185,129,0.15)' },
      { color: '#f59e0b', bg: 'rgba(245,158,11,0.15)' },
    ];

    function hashSlug(slug) {
      let h = 0;
      for (let i = 0; i < (slug || '').length; i++) {
        h = ((h << 5) - h + slug.charCodeAt(i)) | 0;
      }
      return Math.abs(h);
    }

    function humanizeSlug(slug) {
      return (slug || '').split('-').map(function(w) {
        return w.charAt(0).toUpperCase() + w.slice(1);
      }).join(' ');
    }

    function getTopicStyle(slug) {
      const p = TOPIC_PALETTE[hashSlug(slug) % TOPIC_PALETTE.length];
      return { color: p.color, bg: p.bg, label: humanizeSlug(slug) };
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      const d = new Date(dateStr.endsWith('Z') ? dateStr : dateStr + 'Z');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function parseNewsContext(post) {
      if (!post.news_context) return null;
      try { return typeof post.news_context === 'string' ? JSON.parse(post.news_context) : post.news_context; }
      catch { return null; }
    }

    function getCorroborationLevel(ctx) {
      if (!ctx || !ctx.researchSummary) return 'none';
      if (ctx.researchSummary.corroborationSkipped) return 'skipped';
      const v = ctx.researchSummary.verifiedClaims || 0;
      if (v >= 3) return 'strong';
      if (v >= 1) return 'weak';
      return 'none';
    }

    const CORROB_LABELS = {
      strong: { cls: 'corroboration-strong', text: 'Well corroborated' },
      weak: { cls: 'corroboration-weak', text: 'Limited corroboration' },
      skipped: { cls: 'corroboration-weak', text: 'Corroboration skipped' },
      none: { cls: 'corroboration-none', text: 'Uncorroborated' },
    };

    function App() {
      const [status, setStatus] = useState(null);
      const [posts, setPosts] = useState([]);
      const [logs, setLogs] = useState([]);
      const [selectedPost, setSelectedPost] = useState(null);
      const [loading, setLoading] = useState({});
      const [error, setError] = useState(null);
      const [selectedTopic, setSelectedTopic] = useState('');
      const [topics, setTopics] = useState([]);
      const [editingPost, setEditingPost] = useState(null);
      const [editFields, setEditFields] = useState({ title: '', content: '', hashtags: '' });

      const authFetch = useCallback(async (url, opts) => {
        const res = await fetch(url, opts);
        if (res.status === 401) {
          window.location.href = '/auth/login';
          throw new Error('Authentication required');
        }
        return res;
      }, []);

      const fetchAll = useCallback(async () => {
        try {
          // Status is public (uses optionalAuth) — always fetch with regular fetch
          const statusRes = await fetch(`${API}/api/status`).then(r => r.json());

          // Safe defaults for new tenants with no agent_state rows.
          // Without this, status.mode.toUpperCase() crashes when
          // the tenant exists but has never set a mode.
          if (statusRes.user && !statusRes.mode) statusRes.mode = 'manual';
          if (statusRes.user && !statusRes.stats) statusRes.stats = {
            totalPosted: 0, postsLast10Days: 0, pendingApproval: 0, byTopic: []
          };

          setStatus(statusRes);

          // If auth is required and no user, don't fetch protected routes
          if (statusRes.authRequired && !statusRes.user) {
            setPosts([]);
            setLogs([]);
            setError(null);
            return;
          }

          const [postsRes, logsRes] = await Promise.all([
            authFetch(`${API}/api/posts?limit=30`).then(r => r.json()),
            authFetch(`${API}/api/logs?limit=40`).then(r => r.json()),
          ]);
          setPosts(postsRes.posts || []);
          setLogs(logsRes.logs || []);

          // Fetch topics for the selector — 403 is expected for viewers
          try {
            const topicsRes = await fetch(`${API}/api/topics`).then(r => r.ok ? r.json() : null);
            setTopics((topicsRes && topicsRes.topics) || []);
          } catch { setTopics([]); }
          setError(null);
        } catch (err) {
          if (err.message !== 'Authentication required') {
            setError('Service temporarily unavailable. Please try again shortly.');
          }
        }
      }, [authFetch]);

      useEffect(() => {
        fetchAll();
        const interval = setInterval(fetchAll, 15000);
        return () => clearInterval(interval);
      }, [fetchAll]);

      async function toggleMode() {
        const newMode = status.mode === 'auto' ? 'manual' : 'auto';
        await fetch(`${API}/api/mode`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: newMode })
        });
        fetchAll();
      }

      async function handleApprove(id, e) {
        e.stopPropagation();
        setLoading(l => ({ ...l, [`approve-${id}`]: true }));
        try {
          await fetch(`${API}/api/posts/${id}/approve`, { method: 'POST' });
          fetchAll();
        } catch (err) {
          alert('Failed to approve: ' + err.message);
        }
        setLoading(l => ({ ...l, [`approve-${id}`]: false }));
      }

      async function handleReject(id, e) {
        e.stopPropagation();
        await fetch(`${API}/api/posts/${id}/reject`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reason: 'Manually rejected from dashboard' })
        });
        fetchAll();
      }

      function openEditModal(post, e) {
        if (e) e.stopPropagation();
        setEditingPost(post);
        setEditFields({
          title: post.title || '',
          content: post.content || '',
          hashtags: (post.hashtags || []).join(', ')
        });
      }

      async function handleSaveEdit() {
        if (!editingPost) return;
        setLoading(l => ({ ...l, editSave: true }));
        try {
          const hashtags = editFields.hashtags.split(',').map(h => h.trim()).filter(Boolean);
          const res = await fetch(`${API}/api/posts/${editingPost.id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: editFields.title,
              content: editFields.content,
              hashtags
            })
          });
          if (!res.ok) {
            const data = await res.json();
            throw new Error(data.error || 'Failed to save');
          }
          setEditingPost(null);
          fetchAll();
        } catch (err) {
          alert('Save failed: ' + err.message);
        }
        setLoading(l => ({ ...l, editSave: false }));
      }

      async function handleForceCycle() {
        setLoading(l => ({ ...l, forceCycle: true }));
        await fetch(`${API}/api/force-cycle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topicId: selectedTopic || undefined })
        });
        setTimeout(fetchAll, 2000);
        setLoading(l => ({ ...l, forceCycle: false }));
      }

      async function handlePreview() {
        setLoading(l => ({ ...l, preview: true }));
        try {
          const res = await fetch(`${API}/api/generate-preview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topicId: selectedTopic || undefined })
          });
          const data = await res.json();

          if (!res.ok || data.error) {
            throw new Error(data.error || `Server returned ${res.status}`);
          }

          if (data.blocked) {
            alert(`Post blocked — insufficient sources.\n\nTopic: ${getTopicStyle(data.topicId).label}\nAngle: ${data.angle}\nReason: ${data.reason}\n\nThe agent will try a different topic/angle next cycle.`);
            setLoading(l => ({ ...l, preview: false }));
            return;
          }

          setSelectedPost({
            ...data.post,
            quality: data.quality,
            isPreview: true,
            title: data.post.title,
            content: data.post.content,
            hashtags: data.post.hashtags,
            topic_id: data.post.topicId,
            news_context: JSON.stringify({
              sourcesUsed: data.post.sourcesUsed || [],
              researchSummary: data.post.researchSummary || null,
              qualityScores: data.quality?.scores,
              factualFlags: data.quality?.factual_flags
            })
          });
        } catch (err) {
          alert('Preview generation failed: ' + err.message);
        }
        setLoading(l => ({ ...l, preview: false }));
      }

      async function handleRefreshFeeds() {
        setLoading(l => ({ ...l, feeds: true }));
        try {
          await fetch(`${API}/api/research/poll`, { method: 'POST' });
          fetchAll();
        } catch (err) {
          alert('Feed refresh failed: ' + err.message);
        }
        setLoading(l => ({ ...l, feeds: false }));
      }

      async function toggleCorroboration() {
        setLoading(l => ({ ...l, corroboration: true }));
        const current = status.corroboration || 'enabled';
        const newValue = current === 'enabled' ? false : true;
        try {
          await fetch(`${API}/api/corroboration`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: newValue })
          });
          await fetchAll();
        } catch (err) {
          alert('Toggle failed: ' + err.message);
        }
        setLoading(l => ({ ...l, corroboration: false }));
      }

      async function handleSavePreview() {
        if (!selectedPost || !selectedPost.isPreview) return;
        setLoading(l => ({ ...l, savePreview: true }));
        try {
          const res = await fetch(`${API}/api/save-preview`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              topicId: selectedPost.topic_id,
              title: selectedPost.title,
              content: selectedPost.content,
              hashtags: selectedPost.hashtags,
              angle: selectedPost.angle,
              sourcesUsed: selectedPost.sourcesUsed,
              researchSummary: selectedPost.researchSummary,
              quality: selectedPost.quality
            })
          });
          const data = await res.json();
          if (data.success) {
            setSelectedPost(null);
            fetchAll();
          } else {
            alert('Save failed: ' + (data.error || 'Unknown error'));
          }
        } catch (err) {
          alert('Save failed: ' + err.message);
        }
        setLoading(l => ({ ...l, savePreview: false }));
      }

      const pendingPosts = posts.filter(p => p.status === 'pending_approval');
      const recentPosts = posts.filter(p => p.status !== 'pending_approval');

      // ── Login Wall: shown when auth is required but no user ──
      if (status && status.authRequired && !status.user) {
        return (
          <div className="app-container">
            <div className="login-wall">
              <div className="login-wall-title">LinkedIn AI Agent</div>
              <div className="login-wall-subtitle">Authentication required to access the dashboard</div>
              <a href="/auth/login" className="login-btn">Log In</a>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div className="app-container">
            <div className="header">
              <div>
                <div className="header-title">LinkedIn AI Agent</div>
                <div className="header-subtitle">Command Center</div>
              </div>
            </div>
            <div className="sidebar-panel" style={{ textAlign: 'center', padding: '3rem' }}>
              <div style={{ fontSize: '2rem', marginBottom: '1rem' }}>⚡</div>
              <div style={{ color: 'var(--accent-amber)', marginBottom: '0.5rem', fontWeight: 600 }}>
                Service Unavailable
              </div>
              <div style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>{error}</div>
            </div>
          </div>
        );
      }

      if (!status) {
        return (
          <div className="app-container" style={{ textAlign: 'center', paddingTop: '4rem' }}>
            <div className="loading-spinner" style={{ width: 32, height: 32 }}></div>
          </div>
        );
      }

      // ── No-Tenant Panel ──────────────────────────────────────
      // Authenticated user with no workspace assignment. The
      // /api/status endpoint returns tenant-scoped fields as null
      // when findTenantByAuthIdentity finds no membership for the
      // user's sub. Without this guard, the main render below
      // crashes on status.mode.toUpperCase() (line ~322) and
      // status.stats.totalPosted (line ~332).
      //
      // This is a legitimate state — new sign-ups exist before
      // tenant provisioning. Backlog: dedicated /no-tenant route
      // would give a stable URL for tenant-provisioning emails.
      if (status.user && status.stats === null) {
        return (
          <div className="app-container">
            <div className="header">
              <div>
                <div className="header-title">LinkedIn AI Agent</div>
                <div className="header-subtitle">v1.0.95</div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '1.5rem' }}>
                <a href="/" className="btn btn-ghost" style={{ fontSize: '0.75rem', padding: '0.3rem 0.75rem' }}>Home</a>
                <div className="user-info">
                  <span className="user-name">{status.user.name || status.user.email || status.user.sub}</span>
                  <a href="/auth/logout" className="logout-btn">Logout</a>
                </div>
              </div>
            </div>
            <div className="sidebar-panel" style={{ textAlign: 'center', padding: '3rem', marginTop: '2rem' }}>
              <div style={{ fontSize: '2rem', marginBottom: '1rem' }}>🔐</div>
              <div style={{ color: 'var(--accent-amber)', marginBottom: '0.5rem', fontWeight: 600 }}>
                No Membership - Workspace Unassigned
              </div>
              <div style={{ color: 'var(--text-muted)', fontSize: '0.85rem', maxWidth: '32rem', margin: '0 auto' }}>
                Your account is authenticated but isn't yet assigned to a workspace.
                Contact your administrator to be added to one, then log out and back in.
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="app-container">
          {/* Dev Mode Banner */}
          {status && !status.authRequired && (
            <div className="dev-banner">
              <span className="dev-banner-icon">⚠</span>
              <div>
                <div>Authentication Disabled</div>
                <div style={{ fontSize: '0.7rem', opacity: 0.8 }}>NODE_ENV=dev{status.serverAddress ? '  APP_SERVER=' + status.serverAddress : ''}</div>
              </div>
            </div>
          )}
          {/* Header */}
          <div className="header">
            <div>
              <div className="header-title">LinkedIn AI Agent</div>
              <div className="header-subtitle">v1.0.95 · {status.linkedinConnected ? `connected as ${status.linkedinProfile}` : 'linkedin not connected'}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
              {status?.user && (
                <div className="user-info">
                  <span className="user-name">{status.user.name || status.user.email || status.user.sub}</span>
                  <a href="/auth/logout" className="logout-btn">Logout</a>
                </div>
              )}
              <a href="/" className="btn btn-ghost" style={{ fontSize: '0.75rem', padding: '0.3rem 0.75rem' }}>Home</a>
              {status?.user?.role === 'owner' && !status.devBypass && (
                <a href="/app/admin/" className="btn btn-ghost" style={{ fontSize: '0.75rem', padding: '0.3rem 0.75rem' }}>Manage Users</a>
              )}
              {(status?.user?.role === 'owner' || status?.user?.role === 'editor') && !status.devBypass && (
                <a href="/app/topics/" className="btn btn-ghost" style={{ fontSize: '0.75rem', padding: '0.3rem 0.75rem' }}>Topics</a>
              )}
            <div className="mode-switch">
              <span className="mode-label">Mode</span>
              <div className={`toggle-track ${status.mode === 'auto' ? 'active' : ''}`} onClick={toggleMode}>
                <div className="toggle-thumb"></div>
              </div>
              <span className={`mode-value ${status.mode === 'auto' ? 'mode-auto' : 'mode-manual'}`}>
                {(status.mode || 'manual').toUpperCase()}
              </span>
            </div>
            </div>
          </div>

          {/* Stats */}
          <div className="stats-grid">
            <div className="stat-card">
              <div className="stat-label">Total Published</div>
              <div className="stat-value">{status.stats.totalPosted}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Posts (10-day)</div>
              <div className="stat-value">{status.stats.postsLast10Days}</div>
              <div className="cadence-bar">
                <div className="cadence-fill" style={{
                  width: `${(status.stats.postsLast10Days / (status.maxPostsPer10Days || 4)) * 100}%`,
                  background: status.stats.postsLast10Days >= (status.maxPostsPer10Days || 4) ? 'var(--accent-amber)' : 'var(--accent-green)'
                }}></div>
              </div>
              <div className="stat-meta">max {status.maxPostsPer10Days || 4} {status.cadence?.allowed ? '— ready to post' : `— ${status.cadence?.reason?.substring(0, 30)}`}</div>
            </div>
            <div className="stat-card">
              <div className="stat-label">Pending Approval</div>
              <div className="stat-value">
                {status.stats.pendingApproval}
              </div>
            </div>
            <div className="stat-card">
              <div className="stat-label">LinkedIn</div>
              <div className="stat-value" style={{ fontSize: '1rem', marginTop: '0.75rem' }}>
                <span className={`conn-dot ${status.linkedinConnected ? 'connected' : 'disconnected'}`}
                  style={{ display: 'inline-block', marginRight: '0.5rem', verticalAlign: 'middle' }}></span>
                {status.linkedinConnected ? 'Connected' : 'Not Connected'}
              </div>
              {!status.linkedinConnected && (
                <div className="stat-meta">
                  <a href="/auth/linkedin" style={{ color: 'var(--accent-blue)' }}>Connect now →</a>
                </div>
              )}
            </div>
          </div>

          {/* Main content */}
          <div className="main-grid">
            {/* Posts column */}
            <div>
              {/* Pending approval section */}
              {pendingPosts.length > 0 && (
                <div style={{ marginBottom: '2rem' }}>
                  <div className="section-title">
                    Awaiting Approval
                    <span className="badge">{pendingPosts.length}</span>
                  </div>
                  <div className="post-list">
                    {pendingPosts.map(post => {
                      const pCtx = parseNewsContext(post);
                      const pLevel = getCorroborationLevel(pCtx);
                      const pLabel = CORROB_LABELS[pLevel];
                      return (
                      <div key={post.id} className="post-card" onClick={() => setSelectedPost(post)}
                        style={{ borderColor: 'var(--accent-amber)', borderWidth: '1px' }}>
                        <div className="post-card-header">
                          <div style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', flexWrap: 'wrap' }}>
                            <span className="post-topic-badge" style={{ background: getTopicStyle(post.topic_id).bg, color: getTopicStyle(post.topic_id).color }}>
                              {getTopicStyle(post.topic_id).label}
                            </span>
                            <span className={`corroboration-badge ${pLabel.cls}`}>
                              {pLevel === 'strong' ? '◉' : pLevel === 'weak' ? '◎' : '○'} {pLabel.text}
                            </span>
                          </div>
                          <span className="post-status status-pending_approval">PENDING</span>
                        </div>
                        <div className="post-title-text">{post.title}</div>
                        <div className="post-preview">{post.content}</div>
                        <div className="post-footer">
                          <span className="post-date">{formatDate(post.created_at)}</span>
                          <div className="post-actions">
                            <button className="btn btn-approve" onClick={(e) => handleApprove(post.id, e)}>
                              {loading[`approve-${post.id}`] ? <span className="loading-spinner"></span> : 'Approve & Post'}
                            </button>
                            <button className="btn btn-reject" onClick={(e) => handleReject(post.id, e)}>
                              Reject
                            </button>
                            <button className="btn btn-edit" onClick={(e) => openEditModal(post, e)}
                              style={{ fontSize: '0.75rem', padding: '0.3rem 0.6rem' }}>
                              Edit
                            </button>
                          </div>
                        </div>
                      </div>
                      );
                    })}
                  </div>
                </div>
              )}

              {/* Recent posts */}
              <div className="section-title">Recent Posts</div>
              <div className="post-list">
                {recentPosts.length === 0 ? (
                  <div className="sidebar-panel" style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)' }}>
                    No posts yet. Generate your first one below.
                  </div>
                ) : recentPosts.slice(0, 15).map(post => (
                  <div key={post.id} className="post-card" onClick={() => setSelectedPost(post)}>
                    <div className="post-card-header">
                      <span className="post-topic-badge" style={{ background: getTopicStyle(post.topic_id).bg, color: getTopicStyle(post.topic_id).color }}>
                        {getTopicStyle(post.topic_id).label}
                      </span>
                      <span className={`post-status status-${post.status}`}>
                        {post.status.replace('_', ' ').toUpperCase()}
                      </span>
                    </div>
                    <div className="post-title-text">{post.title}</div>
                    <div className="post-preview">{post.content}</div>
                    <div className="post-footer">
                      <span className="post-date">{formatDate(post.posted_at || post.created_at)}</span>
                      {(post.status === 'draft' || post.status === 'pending_approval') && (
                        <button className="btn btn-edit" onClick={(e) => openEditModal(post, e)}
                          style={{ fontSize: '0.75rem', padding: '0.3rem 0.6rem' }}>
                          Edit
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>


            {/* Controls (middle column) */}
            <div>
              {/* AI Model */}
              {status.anthropicModel && (
                <div className="sidebar-panel" style={{ marginBottom: '1rem', padding: '0.75rem 1rem' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>AI Model</span>
                    <span style={{ fontSize: '0.8rem', fontFamily: 'var(--font-mono, monospace)', color: 'var(--accent-cyan)' }}>
                      {status.anthropicModel}
                    </span>
                  </div>
                </div>
              )}
              {/* Quick Actions */}
              <div className="sidebar-panel">
                <div className="section-title">Quick Actions</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '0.5rem' }}>
                  <select className="topic-selector" value={selectedTopic}
                    onChange={e => setSelectedTopic(e.target.value)}>
                    <option value="">Auto-select topic</option>
                    {topics.filter(t => t.enabled !== false).map(t => (
                      <option key={t.id} value={t.slug}>{t.name}</option>
                    ))}
                  </select>
                  <div className="toggle-row">
                    <span className={`toggle-label ${loading.corroboration ? 'toggle-label-inactive' : (status.corroboration || 'enabled') === 'enabled' ? 'toggle-label-active' : 'toggle-label-inactive'}`}>
                      {loading.corroboration ? 'Working...' : `Corroboration ${(status.corroboration || 'enabled') === 'enabled' ? 'ON' : 'OFF'}`}
                    </span>
                    <label className={`toggle-switch ${loading.corroboration ? 'toggle-busy' : ''}`}>
                      <input type="checkbox"
                        checked={(status.corroboration || 'enabled') === 'enabled'}
                        onChange={toggleCorroboration}
                        disabled={loading.corroboration} />
                      <span className="toggle-track"></span>
                    </label>
                  </div>
                  <button className="btn btn-primary" style={{ width: '100%' }} onClick={handlePreview}>
                    {loading.preview ? <span className="loading-spinner"></span> : '✦ Preview New Post'}
                  </button>
                  <button className="btn btn-ghost" style={{ width: '100%' }} onClick={handleForceCycle}>
                    {loading.forceCycle ? <span className="loading-spinner"></span> : '⟳ Force Scheduler Cycle'}
                  </button>
                </div>
              </div>

              {/* Research Monitor */}
              <div className="sidebar-panel">
                <div className="section-title">
                  Research Monitor
                  <span className="badge" style={{ background: 'var(--accent-cyan)' }}>
                    {status.researchStats?.totalArticles || 0}
                  </span>
                </div>
                {status.researchStats ? (
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                      <span style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>Articles (7 days)</span>
                      <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8rem', color: 'var(--accent-cyan)' }}>
                        {status.researchStats.last7Days}
                      </span>
                    </div>
                    <div style={{ maxHeight: '150px', overflowY: 'auto', paddingRight: '0.5rem' }}>
                      {(status.researchStats.byFeed || []).slice(0, 8).map((f, i) => (
                        <div key={i} style={{
                          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                          padding: '0.25rem 0', fontSize: '0.75rem'
                        }}>
                          <span style={{ color: 'var(--text-secondary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '120px' }}>
                            {f.feed_name}
                          </span>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '0.4rem' }}>
                            <span className={`source-tier tier-${f.feed_tier}`}>{f.feed_tier}</span>
                            <span style={{ fontFamily: 'var(--font-mono)', color: 'var(--text-muted)', fontSize: '0.7rem' }}>
                              {f.count}
                            </span>
                          </div>
                        </div>
                      ))}
                    </div>
                    <button className="btn btn-ghost" style={{ width: '100%', marginTop: '0.5rem', fontSize: '0.75rem' }}
                      onClick={handleRefreshFeeds}>
                      {loading.feeds ? <span className="loading-spinner"></span> : '↻ Refresh Feeds Now'}
                    </button>
                  </div>
                ) : (
                  <div style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>Monitor starting...</div>
                )}
              </div>

              {/* Topic Coverage */}
              <div className="sidebar-panel">
                <div className="section-title">Topic Coverage</div>
                {(status.stats.byTopic || []).map(t => (
                  <div key={t.topic_id} style={{ marginBottom: '0.75rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.25rem' }}>
                      <span className="post-topic-badge" style={{ fontSize: '0.65rem', background: getTopicStyle(t.topic_id).bg, color: getTopicStyle(t.topic_id).color }}>
                        {getTopicStyle(t.topic_id).label}
                      </span>
                      <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                        {t.count} posts
                      </span>
                    </div>
                  </div>
                ))}
                {(!status.stats.byTopic || status.stats.byTopic.length === 0) && (
                  <div style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>No posts yet</div>
                )}
              </div>
            </div>

            {/* Activity Log (right column) */}
            <div>
              <div className="sidebar-panel">
                <div className="section-title">Activity Log</div>
                <div style={{ maxHeight: '600px', overflowY: 'auto', paddingRight: '0.5rem' }}>
                  {logs.slice(0, 30).map(log => {
                    let cycleId = null;
                    try {
                      const d = typeof log.details === 'string' ? JSON.parse(log.details) : log.details;
                      if (d && d.cycleId) cycleId = d.cycleId;
                    } catch {}
                    return (
                    <div key={log.id} className="log-entry">
                      <div className={`log-dot ${log.level}`}></div>
                      <div>
                        <div className="log-text">{log.action.replace(/_/g, ' ')}</div>
                        <div className="log-meta">
                          <span className="log-id">#{log.id}</span>
                          {cycleId && <span className="log-cycle">{cycleId}</span>}
                          <span className="log-time">{formatDate(log.timestamp)}</span>
                        </div>
                      </div>
                    </div>
                    );
                  })}
                  {logs.length === 0 && (
                    <div style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>No activity yet</div>
                  )}
                </div>
              </div>
            </div>

          </div>

          {/* Post Detail Modal */}
          {selectedPost && (() => {
            const ctx = parseNewsContext(selectedPost);
            const corrobLevel = getCorroborationLevel(ctx);
            const corrobLabel = CORROB_LABELS[corrobLevel];
            return (
            <div className="modal-overlay" onClick={() => setSelectedPost(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <button className="modal-close" onClick={() => setSelectedPost(null)}>✕</button>
                <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: '0.25rem' }}>
                  <span className="post-topic-badge" style={{ background: getTopicStyle(selectedPost.topic_id).bg, color: getTopicStyle(selectedPost.topic_id).color }}>
                    {getTopicStyle(selectedPost.topic_id).label}
                  </span>
                  {selectedPost.isPreview && (
                    <span className="post-status" style={{ background: 'var(--glow-blue)', color: 'var(--accent-blue)' }}>PREVIEW</span>
                  )}
                  <span className={`corroboration-badge ${corrobLabel.cls}`}>
                    {corrobLevel === 'strong' ? '◉' : corrobLevel === 'weak' ? '◎' : '○'} {corrobLabel.text}
                  </span>
                </div>

                <h3 style={{ margin: '1rem 0 0.5rem', fontSize: '1.1rem' }}>{selectedPost.title}</h3>

                {ctx?.researchSummary && (
                  <div className="research-summary">
                    <span className="research-stat"><strong>{ctx.researchSummary.verifiedClaims}</strong> verified claims</span>
                    <span className="research-stat"><strong>{ctx.researchSummary.independentSources}</strong> independent sources</span>
                    <span className="research-stat"><strong>{ctx.researchSummary.totalSourceItems}</strong> source items</span>
                    <span className="research-stat"><strong>{ctx.researchSummary.sourceList?.length || 0}</strong> cited</span>
                  </div>
                )}

                <div className="modal-body">{selectedPost.content}</div>
                <div className="modal-hashtags">
                  {(selectedPost.hashtags || []).map((tag, i) => (
                    <span key={i} className="hashtag">{tag}</span>
                  ))}
                </div>

                {ctx?.researchSummary?.sourceList && ctx.researchSummary.sourceList.length > 0 && (
                  <div className="source-list">
                    <div style={{ fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.5rem', color: 'var(--accent-cyan)' }}>
                      Sources ({ctx.researchSummary.sourceList.length})
                    </div>
                    {ctx.researchSummary.sourceList.map((src, i) => (
                      <div key={i} className="source-item">
                        <div>
                          <span className="source-name">{src.name}</span>
                          {src.url && (<div><a href={src.url} target="_blank" rel="noopener" className="source-url">{src.url}</a></div>)}
                        </div>
                        <span className={`source-tier tier-${src.tier}`}>{src.tier}</span>
                      </div>
                    ))}
                  </div>
                )}

                {!ctx?.researchSummary?.sourceList && ctx?.sourcesUsed && ctx.sourcesUsed.length > 0 && (
                  <div className="source-list">
                    <div style={{ fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.5rem', color: 'var(--accent-cyan)' }}>Sources Referenced</div>
                    {ctx.sourcesUsed.map((name, i) => (
                      <div key={i} className="source-item"><span className="source-name">{name}</span></div>
                    ))}
                  </div>
                )}

                {ctx?.factualFlags && ctx.factualFlags.length > 0 && ctx.factualFlags[0] !== '' && (
                  <div className="factual-flags">
                    <div style={{ fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.5rem', color: 'var(--accent-red)' }}>
                      Factual Flags — Review Before Approving
                    </div>
                    {ctx.factualFlags.map((flag, i) => (
                      <div key={i} className="flag-item"><span>⚠</span><span>{flag}</span></div>
                    ))}
                  </div>
                )}

                {selectedPost.quality && (
                  <div style={{ marginTop: '1.5rem', padding: '1rem', background: 'var(--bg-secondary)', borderRadius: 'var(--radius-sm)' }}>
                    <div style={{ fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.5rem' }}>Quality Assessment</div>
                    {Object.entries(selectedPost.quality.scores || {}).map(([key, val]) => (
                      <div key={key} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.25rem' }}>
                        <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', width: '140px', fontFamily: 'var(--font-mono)' }}>
                          {key.replace(/_/g, ' ')}
                        </span>
                        <div style={{ flex: 1, height: '6px', background: 'var(--bg-primary)', borderRadius: '3px' }}>
                          <div style={{
                            width: `${val * 10}%`, height: '100%', borderRadius: '3px',
                            background: val >= 7 ? 'var(--accent-green)' : val >= 5 ? 'var(--accent-amber)' : 'var(--accent-red)'
                          }}></div>
                        </div>
                        <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.75rem', color: 'var(--text-secondary)' }}>{val}</span>
                      </div>
                    ))}
                    <div style={{ marginTop: '0.5rem', fontSize: '0.8rem', color: 'var(--text-secondary)' }}>
                      Overall: <strong style={{ color: selectedPost.quality.pass ? 'var(--accent-green)' : 'var(--accent-amber)' }}>
                        {selectedPost.quality.overall}/10 {selectedPost.quality.pass ? '✓ Pass' : '⚠ Needs work'}
                      </strong>
                    </div>
                  </div>
                )}
                {selectedPost.status === 'pending_approval' && (
                  <div style={{ display: 'flex', gap: '0.75rem', marginTop: '1.5rem' }}>
                    <button className="btn btn-approve" onClick={(e) => { handleApprove(selectedPost.id, e); setSelectedPost(null); }}>
                      Approve & Publish
                    </button>
                    <button className="btn btn-reject" onClick={(e) => { handleReject(selectedPost.id, e); setSelectedPost(null); }}>
                      Reject
                    </button>
                    <button className="btn btn-edit" onClick={(e) => { openEditModal(selectedPost, e); setSelectedPost(null); }}>
                      Edit
                    </button>
                  </div>
                )}
                {selectedPost.isPreview && (
                  <div style={{ display: 'flex', gap: '0.75rem', marginTop: '1.5rem' }}>
                    <button className="btn btn-approve" onClick={handleSavePreview}>
                      {loading.savePreview ? <span className="loading-spinner"></span> : 'Queue for Approval'}
                    </button>
                    <button className="btn btn-ghost" onClick={() => setSelectedPost(null)}>
                      Discard
                    </button>
                  </div>
                )}
              </div>
            </div>
            );
          })()}

          {/* Edit Post Modal */}
          {editingPost && (
            <div className="modal-overlay" onClick={() => setEditingPost(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '600px' }}>
                <button className="modal-close" onClick={() => setEditingPost(null)}>✕</button>
                <h3 style={{ margin: '0 0 1rem', fontSize: '1.1rem' }}>Edit Post</h3>
                <div style={{ marginBottom: '0.75rem' }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.25rem', color: 'var(--text-muted)' }}>Title</label>
                  <input type="text" value={editFields.title}
                    onChange={e => setEditFields(f => ({ ...f, title: e.target.value }))}
                    style={{ width: '100%', padding: '0.4rem 0.6rem', borderRadius: '4px', border: '1px solid var(--border)', background: 'var(--bg-secondary)', color: 'var(--text-primary)', fontSize: '0.9rem' }} />
                </div>
                <div style={{ marginBottom: '0.75rem' }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.25rem', color: 'var(--text-muted)' }}>Content</label>
                  <textarea value={editFields.content}
                    onChange={e => setEditFields(f => ({ ...f, content: e.target.value }))}
                    rows={10}
                    style={{ width: '100%', padding: '0.5rem', borderRadius: '4px', border: '1px solid var(--border)', background: 'var(--bg-secondary)', color: 'var(--text-primary)', fontSize: '0.85rem', fontFamily: 'inherit', resize: 'vertical' }} />
                </div>
                <div style={{ marginBottom: '1rem' }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', fontWeight: 600, marginBottom: '0.25rem', color: 'var(--text-muted)' }}>Hashtags (comma-separated)</label>
                  <input type="text" value={editFields.hashtags}
                    onChange={e => setEditFields(f => ({ ...f, hashtags: e.target.value }))}
                    style={{ width: '100%', padding: '0.4rem 0.6rem', borderRadius: '4px', border: '1px solid var(--border)', background: 'var(--bg-secondary)', color: 'var(--text-primary)', fontSize: '0.9rem' }} />
                </div>
                <div style={{ display: 'flex', gap: '0.75rem', justifyContent: 'flex-end' }}>
                  <button className="btn btn-ghost" onClick={() => setEditingPost(null)}>Cancel</button>
                  <button className="btn btn-approve" onClick={handleSaveEdit} disabled={loading.editSave}>
                    {loading.editSave ? <span className="loading-spinner"></span> : 'Save Changes'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
