<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .title { font-size: 14px; font-weight: 600; }
    .subtitle { font-size: 11px; opacity: 0.7; }
    .label { font-size: 11px; font-weight: 500; }
    .small { font-size: 10px; opacity: 0.6; }
    .connector { stroke: #6b7280; stroke-width: 1.2; fill: none; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1.5L8 5L2 8.5" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="580" rx="12" fill="#0f172a"/>

  <!-- Title -->
  <text x="380" y="32" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500" letter-spacing="0.08em">LINKEDIN AI AGENT — SYSTEM ARCHITECTURE</text>

  <!-- ═══ Topics Sidebar (LEFT) ═══ -->
  <rect x="18" y="164" width="84" height="320" rx="10" fill="#0c2a1a" stroke="#34d399" stroke-width="0.8"/>
  <text class="label" x="60" y="190" text-anchor="middle" fill="#6ee7b7">Topics</text>
  <line x1="30" y1="200" x2="90" y2="200" stroke="#34d399" stroke-width="0.4" opacity="0.4"/>
  <text class="small" x="60" y="228" text-anchor="middle" fill="#6ee7b7">AI benefits</text>
  <text class="small" x="60" y="268" text-anchor="middle" fill="#6ee7b7">AI guardrails</text>
  <text class="small" x="60" y="318" text-anchor="middle" fill="#6ee7b7">Cyber</text>
  <text class="small" x="60" y="334" text-anchor="middle" fill="#6ee7b7">incidents</text>
  <text class="small" x="60" y="382" text-anchor="middle" fill="#6ee7b7">Cyber</text>
  <text class="small" x="60" y="398" text-anchor="middle" fill="#6ee7b7">advances</text>

  <!-- ═══ Dashboard ═══ -->
  <rect x="120" y="52" width="570" height="72" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8"/>
  <text class="title" x="405" y="78" text-anchor="middle" fill="#93c5fd">Dashboard (Express + React)</text>
  <text class="subtitle" x="405" y="98" text-anchor="middle" fill="#7aa8d4">Mode toggle · Approval queue · Activity log · Stats</text>

  <!-- Arrows: Dashboard → Scheduler, Dashboard → Mode Controller -->
  <line x1="270" y1="124" x2="270" y2="160" class="connector" marker-end="url(#ah)"/>
  <line x1="540" y1="124" x2="540" y2="160" class="connector" marker-end="url(#ah)"/>

  <!-- ═══ Scheduler ═══ -->
  <rect x="130" y="164" width="260" height="72" rx="10" fill="#0f3b3b" stroke="#14b8a6" stroke-width="0.8"/>
  <text class="title" x="260" y="192" text-anchor="middle" fill="#5eead4">Scheduler (node-cron)</text>
  <text class="subtitle" x="260" y="212" text-anchor="middle" fill="#4aac9e">Cadence rules · Topic rotation · Quality gate</text>

  <!-- ═══ Mode Controller ═══ -->
  <rect x="420" y="164" width="260" height="72" rx="10" fill="#3b2e10" stroke="#f59e0b" stroke-width="0.8"/>
  <text class="title" x="550" y="192" text-anchor="middle" fill="#fcd34d">Mode Controller</text>
  <text class="subtitle" x="550" y="212" text-anchor="middle" fill="#c8a63a">Auto ↔ Manual switching</text>

  <!-- Arrows: Scheduler → Content Gen, Scheduler → LinkedIn -->
  <line x1="210" y1="236" x2="210" y2="280" class="connector" marker-end="url(#ah)"/>
  <line x1="330" y1="236" x2="470" y2="280" class="connector" marker-end="url(#ah)"/>

  <!-- ═══ Content Generator ═══ -->
  <rect x="130" y="284" width="230" height="72" rx="10" fill="#2d1854" stroke="#a78bfa" stroke-width="0.8"/>
  <text class="title" x="245" y="312" text-anchor="middle" fill="#c4b5fd">Content Generator</text>
  <text class="subtitle" x="245" y="332" text-anchor="middle" fill="#9a8abf">Claude API · Quality scoring</text>

  <!-- ═══ LinkedIn API ═══ -->
  <rect x="390" y="284" width="240" height="72" rx="10" fill="#3b1515" stroke="#f87171" stroke-width="0.8"/>
  <text class="title" x="510" y="312" text-anchor="middle" fill="#fca5a5">LinkedIn API Service</text>
  <text class="subtitle" x="510" y="332" text-anchor="middle" fill="#c47a7a">OAuth 2.0 · UGC post publish</text>

  <!-- Arrow: Content Gen → LinkedIn API -->
  <line x1="360" y1="320" x2="388" y2="320" stroke="#3b82f6" stroke-width="1.2" fill="none" marker-end="url(#ah-blue)"/>
  <text class="small" x="374" y="312" text-anchor="middle" fill="#60a5fa">publish</text>

  <!-- Arrow: Topics → Content Gen (clean left-side connection) -->
  <line x1="102" y1="320" x2="128" y2="320" stroke="#34d399" stroke-width="1" fill="none" stroke-dasharray="4 3" marker-end="url(#ah-green)"/>

  <!-- Arrows: Content Gen → DB, LinkedIn → DB -->
  <line x1="245" y1="356" x2="245" y2="408" class="connector" marker-end="url(#ah)"/>
  <line x1="510" y1="356" x2="510" y2="408" class="connector" marker-end="url(#ah)"/>

  <!-- ═══ SQLite Database ═══ -->
  <rect x="130" y="412" width="500" height="72" rx="10" fill="#1e1e24" stroke="#6b7280" stroke-width="0.8"/>
  <text class="title" x="380" y="440" text-anchor="middle" fill="#d1d5db">SQLite Database</text>
  <text class="subtitle" x="380" y="460" text-anchor="middle" fill="#9ca3af">Post history · Agent state · Activity log</text>

  <!-- ═══ Footer cadence note ═══ -->
  <rect x="100" y="510" width="520" height="36" rx="8" fill="#1a1a2e" stroke="#334155" stroke-width="0.5"/>
  <text x="360" y="533" text-anchor="middle" fill="#64748b" font-size="11">2–4 posts / 10-day window  ·  72h min gap  ·  Weighted topic rotation  ·  AI quality gate</text>
</svg>
