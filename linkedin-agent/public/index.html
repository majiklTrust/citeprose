<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/app/favicon.png">
  <title>Market Intelligence — Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <link rel="stylesheet" href="/app/styles/app.css?v=109">
  <link rel="stylesheet" href="/app/styles/app-mobile.css?v=109">
</head>
<body>
  <div id="root"></div>

  <!-- Blocking overlay for content generation -->
  <div id="generate-overlay" class="overlay-backdrop">
    <div class="overlay-card">
      <div class="overlay-spinner-row">
        <div class="overlay-spinner"></div>
      </div>
      <div class="overlay-title">Generating Content</div>
      <div class="overlay-sub">Researching sources and composing your post. This may take a moment.</div>
      <div class="overlay-fine">Your draft is saved automatically.</div>
    </div>
  </div>
  <div id="keygate-overlay" class="overlay-backdrop">
    <div class="overlay-card">
      <div class="overlay-spinner-row">
        <div class="overlay-spinner"></div>
      </div>
      <div class="overlay-title">Generating content needs a valid LLM Provider API key to activate.</div>
      <div class="overlay-sub">Redirecting to the Management page.</div>
      <div class="overlay-fine"></div>
    </div>
  </div>

  <script src="/app/dashboard.js?v=109"></script>
</body>
</html>
