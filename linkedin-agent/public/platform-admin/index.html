<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Admin — LinkedIn Agent</title>
  <link rel="stylesheet" href="/styles/app.css">
  <style>
    .container { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    .page-title { font-size: 1.5rem; font-weight: 700; color: #333; margin-bottom: 0.2rem; }
    .subtitle { font-size: 0.78rem; color: #888; margin-bottom: 1.5rem; }

    .query-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; margin-bottom: 2rem; }
    .query-card { border: 1px solid #e0e0e0; border-radius: 6px; padding: 0.6rem 0.7rem; background: #fff; }
    .query-card.destructive { border-left: 3px solid #d32f2f; }
    .query-card.read-only { border-left: 3px solid #0073b1; }
    .query-header { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.3rem; }
    .query-header-main { display: flex; align-items: center; gap: 0.5rem; flex: 0 0 auto; }
    .query-label { font-weight: 600; font-size: 0.95rem; }
    .query-desc { font-size: 0.82rem; color: #666; margin-bottom: 0.5rem; }
    .query-capability { background: #f5f9fc; border: 1px solid #dce8f2; border-radius: 4px; padding: 0.25rem 0.5rem; flex: 1 1 240px; }
    .capability-tag { display: inline-block; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #0073b1; margin-right: 0.45rem; }
    .capability-text { font-size: 0.8rem; color: #44525c; }
    .query-badge { font-size: 0.68rem; padding: 0.1rem 0.4rem; border-radius: 3px; font-weight: 600; }
    @media (max-width: 640px) { .query-capability { flex-basis: 100%; } }
    .badge-read { background: #e3f2fd; color: #1565c0; }
    .badge-write { background: #fff3e0; color: #e65100; }
    .badge-destructive { background: #ffebee; color: #c62828; }

    .param-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.4rem; flex-wrap: wrap; }
    .param-row label { font-size: 0.8rem; font-weight: 500; color: #555; min-width: 100px; }
    .param-row input, .param-row select { padding: 0.3rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; flex: 1; min-width: 200px; max-width: 400px; }

    .query-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .btn-run { padding: 0.35rem 0.9rem; border: none; border-radius: 4px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .btn-run-read { background: #0073b1; color: #fff; }
    .btn-run-read:hover { background: #005f8f; }
    .btn-run-write { background: #e65100; color: #fff; }
    .btn-run-write:hover { background: #bf4400; }
    .btn-run-destructive { background: #d32f2f; color: #fff; }
    .btn-run-destructive:hover { background: #b71c1c; }
    .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-area { margin-top: 0.75rem; display: none; }
    .result-area.visible { display: block; }
    .result-status { font-size: 0.8rem; margin-bottom: 0.35rem; padding: 0.3rem 0.6rem; border-radius: 4px; }
    .result-success { background: #e8f5e9; color: #2e7d32; }
    .result-error { background: #ffebee; color: #c62828; }
    .result-table-wrap { overflow-x: auto; max-height: 400px; overflow-y: auto; }
    .result-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .result-table th { background: #f5f5f5; padding: 0.35rem 0.5rem; text-align: left; border-bottom: 2px solid #ddd; position: sticky; top: 0; }
    .result-table td { padding: 0.3rem 0.5rem; border-bottom: 1px solid #eee; font-family: monospace; word-break: break-all; max-width: 300px; }
    .result-table tr:hover { background: #fafafa; }

    .nav-back { font-size: 0.85rem; margin-bottom: 1rem; }
    .nav-back a { color: #0073b1; text-decoration: none; }

    .auth-wall { display: none; text-align: center; padding: 4rem 1rem; }
    .auth-wall h2 { color: #d32f2f; }
    .main-content { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-back"><a href="/app">← Dashboard</a></div>

    <div id="auth-wall" class="auth-wall">
      <h2>Access Denied</h2>
      <p>Platform admin privileges required.</p>
      <a href="/app">Back to Dashboard</a>
    </div>

    <div id="main-content" class="main-content">
      <h1 class="page-title">Platform Admin</h1>
      <p class="subtitle">server-side query execution for platform operations</p>
      <div id="query-grid" class="query-grid">
        <span style="color:#999;">Loading queries...</span>
      </div>
    </div>
  </div>
  <script src="platform-admin.js"></script>
</body>
</html>
